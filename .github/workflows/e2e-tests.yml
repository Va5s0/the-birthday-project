name: E2E Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: |
          cd server
          npm run prisma:generate

      - name: Setup test database
        run: |
          cd server
          # Create test database directory if it doesn't exist
          mkdir -p prisma
          # Run migrations to create test.db
          DATABASE_URL="file:./prisma/test.db" npx prisma migrate deploy

      - name: Build application
        run: npm run build

      - name: Create .env.test file
        run: |
          cat > .env.test << EOF
          # Test Environment Configuration
          TEST_BASE_URL=http://localhost:3002
          TEST_API_URL=http://localhost:5001/api
          TEST_DATABASE_URL="file:./server/prisma/test.db"
          TEST_USER_EMAIL=testuser@example.com
          TEST_USER_PASSWORD=TestPassword123!
          TEST_USER2_EMAIL=testuser2@example.com
          TEST_USER2_PASSWORD=TestPassword456!
          EOF

      - name: Create server .env file
        run: |
          cd server
          cat > .env << EOF
          PORT=5001
          DATABASE_URL="file:./prisma/test.db"
          JWT_SECRET=test-jwt-secret-for-ci-only-not-production
          JWT_REFRESH_SECRET=test-refresh-secret-for-ci-only-not-production
          JWT_EXPIRES_IN=1h
          JWT_REFRESH_EXPIRES_IN=7d
          NODE_ENV=test
          EOF

      - name: Start backend server
        run: |
          cd server
          npm run dev &
          echo $! > ../backend.pid
        env:
          DATABASE_URL: "file:./prisma/test.db"

      - name: Start frontend server
        run: |
          npm run serve &
          echo $! > frontend.pid

      - name: Wait for servers to be ready
        run: npx wait-on http://localhost:5001/api http://localhost:3002 --timeout 60000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/results.json
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          # Kill servers if they're still running
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) || true
          fi

      - name: Test Summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/results.json ]; then
            echo "Test results available in artifacts" >> $GITHUB_STEP_SUMMARY
          fi
